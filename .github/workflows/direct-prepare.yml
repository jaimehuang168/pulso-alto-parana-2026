name: Prepare direct use
on:
  push:
    branches: ['fix/direct-v31-no-activation']
    paths: ['.github/workflows/direct-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/direct-v31-no-activation
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate reviewed source and owner installer
        run: |
          python v3/direct/prepare.py
          python v3/direct/docs.py
          python docs/build-company-manuals.py
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test tests/*.cjs
          node --test v3/tests/*.test.mjs
          node v3/tests/direct-use.mjs
      - name: Commit only tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md docs/build-company-manuals.py v3/web/app.mjs v3/web/modules/views.mjs v3/web/modules/company.mjs v3/web/simulation.mjs v3/scripts/build.mjs supabase/V3_1_DIRECT_USE.sql v3/web/manual-es.html v3/web/manual-es-zh.html
          if ! git diff --cached --quiet; then git commit -m '安裝後直接登入V3.1，取消Activate與三項必填聲明';git push origin HEAD:fix/direct-v31-no-activation;fi
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: direct-use-sql-evidence
          path: v3/evidence/direct-use-sql.json
          retention-days: 7
