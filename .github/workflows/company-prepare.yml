name: Prepare company source
on:
  push:
    branches: ['release/company-admin-3-1']
    paths: ['.github/workflows/company-prepare.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/company-admin-3-1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Verify exact source payload and permitted paths
        run: |
          python - <<'PY'
          import pathlib,base64,hashlib,tarfile,io
          root=pathlib.Path('.');parts=[root/f'v3/company/source-part-{i}.txt' for i in [1,2,3]]
          if all(p.exists() for p in parts):
            data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
            assert hashlib.sha256(data).hexdigest()=='f5d700a1bd2f1feeb91586308c406bab2660ab43b80060eea0dd237abcc35eb2'
            with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as t:
              for m in t.getmembers():
                assert m.isfile() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.name.startswith('/')
                assert m.name.startswith(('v3/company/','v3/tests/company')) or m.name=='v3/web/modules/company.mjs'
                assert m.name.endswith(('.sql','.py','.mjs')) and m.size<100000
                p=root/m.name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(t.extractfile(m).read())
            for p in parts:p.unlink()
          PY
          python v3/company/prepare.py
          python v3/company/finalize.py
      - name: Check generated code and database boundary cases before commit
        run: |
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/company-ui.test.mjs
          node v3/tests/company.mjs
      - name: Commit only reviewed source, never credentials or evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v3/company v3/web/modules/company.mjs v3/web/modules/core.mjs v3/web/modules/views.mjs v3/web/app.mjs v3/web/styles.css v3/web/simulation.mjs v3/scripts/build.mjs v3/tests/company.mjs v3/tests/company-ui.test.mjs v3/tests/company-browser.py v3/tests/company-native.mjs v3/tests/company-native-browser.py supabase/migrations/012_v3_company_admin.sql supabase/V3_1_COMPANY_UPGRADE.sql
          if ! git diff --cached --quiet; then
            git commit -m '完成公司資料自助管理與受保護Super Admin；保留舊報表安全限制'
            git push origin HEAD:release/company-admin-3-1
          fi
          gh workflow run company-verify.yml --ref release/company-admin-3-1
