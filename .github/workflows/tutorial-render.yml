name: Render Spanish tutorials
on:
  push:
    branches: [docs/spanish-video-tutorials]
    paths: ['docs/tutorials/scenes.json','docs/tutorials/render.py','docs/tutorials/verify_player.py','docs/tutorials/site/**','.github/workflows/tutorial-render.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spanish-tutorial-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read verified synthetic screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/tutorial-captures /tmp/tutorial-media /tmp/tutorial-delivery /tmp/pulso-voice
          gh api repos/$GITHUB_REPOSITORY/actions/runs/36353637989 > /tmp/capture-run.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/capture-run.json'))
          assert r['head_sha']=='153edc0d15ba84a26e8f7fdbb9e5a5eb534ac6b2' and r['conclusion']=='success'
          PY
          gh run download 36353637989 --repo "$GITHUB_REPOSITORY" --name pulso-tutorial-captures --dir /tmp/tutorial-captures
          python - <<'PY'
          import json,re
          c=json.load(open('/tmp/tutorial-captures/captures.json'))
          assert len(c['checks'])==7 and all(x['pass'] for x in c['checks'])
          text=open('docs/tutorials/scenes.json').read()
          assert not re.search('[\u3400-\u9fff]|Super Admin|jaimehuang168@gmail',text)
          d=json.loads(text);assert len(d['videos'])==2 and sum(len(v['chapters']) for v in d['videos'])==32
          PY
          cp docs/tutorials/site/* /tmp/tutorial-media/
      - name: Prepare offline Spanish voice and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install piper-tts==1.3.0 Pillow==11.3.0 playwright==1.57.0
          python -m piper.download_voices es_MX-ald-medium --data-dir /tmp/pulso-voice
          python -m playwright install --with-deps chromium
          cat > /tmp/tutorial-media/CREDITOS.txt <<'TXT'
          PULSO 3.1.3 · Tutoriales en español
          Pantallas: aplicación 3.1.3, simulación SQL y comprobaciones aisladas. Ninguna entrevista real.
          Guion: Manual de uso 3.1.3. Admin de empresa y encuestadores/usuarios de lectura.
          Formato: explicación paso a paso con capturas de interfaz, narración sintética, subtítulos y capítulos.
          Voz: Piper, modelo es_MX-ald-medium. No representa a una persona de la empresa.
          Modelo y licencia: https://huggingface.co/rhasspy/piper-voices/blob/main/es/es_MX/ald/medium/MODEL_CARD
          Piper: https://github.com/OHF-Voice/piper1-gpl
          No se distribuyen modelos de voz, fuentes tipográficas ni credenciales.
          Estas guías no certifican ensayos en producción ni aceptación de teléfonos físicos.
          TXT
      - name: Produce narration, captions, chapters and verify complete video decoding
        run: |
          python -m py_compile docs/tutorials/capture.py docs/tutorials/render.py docs/tutorials/verify_player.py
          node --check docs/tutorials/site/tutorials.js
          python docs/tutorials/render.py --scenes docs/tutorials/scenes.json --images /tmp/tutorial-captures --out /tmp/tutorial-media --model /tmp/pulso-voice/es_MX-ald-medium.onnx
      - name: Verify actual media playback and responsive teaching page
        run: python docs/tutorials/verify_player.py /tmp/tutorial-media
      - name: Package checked public teaching materials
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,os
          r=Path('/tmp/tutorial-media');d=json.loads((r/'tutorials.json').read_text());p=json.loads((r/'player-checks.json').read_text())
          assert p['failed']==0 and p['passed']>=20
          d['build_commit']=os.environ['GITHUB_SHA'];d['render_run']=os.environ['GITHUB_RUN_ID']
          d['files']={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in r.iterdir() if f.is_file() and f.name!='tutorials.json'}
          (r/'tutorials.json').write_text(json.dumps(d,ensure_ascii=False,indent=2))
          with zipfile.ZipFile('/tmp/tutorial-delivery/Pulso_313_Tutoriales_ES.zip','w',zipfile.ZIP_DEFLATED) as z:
              for f in r.iterdir():
                  if f.is_file():z.write(f,f.name)
          Path('/tmp/tutorial-delivery/tutorials.json').write_bytes((r/'tutorials.json').read_bytes())
          Path('/tmp/tutorial-delivery/player-checks.json').write_bytes((r/'player-checks.json').read_bytes())
          print([(v['id'],v['duration_seconds'],v['bytes']) for v in d['videos']])
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: success()
        with:
          name: pulso-spanish-tutorials
          path: /tmp/tutorial-delivery
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.0
        if: failure()
        with:
          name: pulso-tutorial-render-diagnostics
          path: |
            /tmp/tutorial-media/*.json
            /tmp/tutorial-media/*.txt
            /tmp/tutorial-media/*.png
          retention-days: 7
