name: Capture Spanish tutorials
on:
  push:
    branches: [docs/spanish-video-tutorials]
    paths: ['docs/tutorials/capture.py', '.github/workflows/tutorial-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use exact released 3.1.3 UI and isolated simulator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pulso-release /tmp/pulso-demo /tmp/pulso-login /tmp/tutorial-captures /tmp/verified-ui
          gh run download 36352837638 --repo "$GITHUB_REPOSITORY" --name pulso-workspace-release --dir /tmp/pulso-release
          tar -xzf /tmp/pulso-release/workspace-demo.tar.gz -C /tmp/pulso-demo
          tar -xzf /tmp/pulso-release/workspace-frontend.tar.gz -C /tmp/pulso-login
          gh run download 36352261549 --repo "$GITHUB_REPOSITORY" --name pulso-workspace-delivery --dir /tmp/verified-ui
          cp /tmp/verified-ui/evidence/live-native-browser/chromium-native-four-cities.png /tmp/tutorial-captures/a_live_four.png
          cp /tmp/verified-ui/evidence/live-native-browser/chromium-native-single-mobile.png /tmp/tutorial-captures/u_live_single.png
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Capture company and interviewer workflows with no hosted requests
        run: python docs/tutorials/capture.py --demo /tmp/pulso-demo --login /tmp/pulso-login --out /tmp/tutorial-captures
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-tutorial-captures
          path: /tmp/tutorial-captures
          retention-days: 14
