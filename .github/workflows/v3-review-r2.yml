name: V3 review R2 recovery
on:
  push:
    branches: ['v3/field-operations']
    paths: ['.github/workflows/v3-review-r2.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v3/field-operations
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Correct fixture ordering without removing activation checks
        shell: python
        run: |
          from pathlib import Path
          p=Path('v3/tests/native.mjs');s=p.read_text()
          marker=" await check('Explicit cutover fences the old deployed account API and tables'"
          lines=s.splitlines(keepends=True)
          found=[i for i,x in enumerate(lines) if x.startswith(marker)]
          assert len(found)==1
          line=lines.pop(found[0])
          target=next(i for i,x in enumerate(lines) if x.startswith(" const today="))
          lines.insert(target,line)
          p.write_text(''.join(lines))
      - name: Install locked dependencies and check source
        working-directory: v3
        run: |
          npm ci
          npm run check
          npm test
          mkdir -p evidence
          npm audit --json > evidence/dependency-audit.json
      - name: Run database and enrollment protocol regressions
        working-directory: v3
        run: |
          node tests/database.mjs
          node tests/enrollment.mjs
      - name: Build local presentation package
        working-directory: v3
        run: |
          node scripts/fetch-vendor.mjs
          node scripts/build.mjs --demo
      - name: Commit only verified test fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v3/tests/native.mjs
          if ! git diff --cached --quiet; then
            git commit -m '修正 V3 原生測試前置切換順序；保留正式切換保護'
            git push origin HEAD:v3/field-operations
          fi
          gh workflow run v3-native.yml --ref v3/field-operations
      - name: Package versioned source and local preview
        if: always()
        run: |
          mkdir -p /tmp/pulso-r2
          git archive --format=zip HEAD -o /tmp/pulso-r2/source.zip
          git rev-parse HEAD > /tmp/pulso-r2/SOURCE_SHA.txt
          if [ -d v3/preview ]; then tar -czf /tmp/pulso-r2/preview.tar.gz -C v3 preview; fi
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-v3-review-r2
          path: |
            /tmp/pulso-r2/
            v3/evidence/
          retention-days: 7
