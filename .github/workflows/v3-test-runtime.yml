name: V3 disposable test runtime
on:
  push:
    branches: [feature/v3-field-operations]
    paths: ['.github/workflows/v3-test-runtime.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Download pinned open-source browser libraries
        run: |
          mkdir -p /tmp/browserlibs
          cd /tmp/browserlibs
          npm pack --ignore-scripts fflate@0.8.2
          npm pack --ignore-scripts qrcode-generator@1.4.4
          npm view supabase version > supabase-cli-version.txt
          sha256sum *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: v3-pinned-browser-libraries
          path: /tmp/browserlibs/
          retention-days: 2
