name: Prepare Spanish workspace
on:
  push:
    branches: ['ui/v2-style-spanish-workspace']
    paths: ['.github/workflows/workspace-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ui/v2-style-spanish-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply reviewed interface-only changes
        run: |
          python v3/workspace/prepare.py
          python v3/workspace/finalize.py
          python docs/build-company-manuals.py
          node --check v3/web/app.mjs
          node --check v3/web/modules/views.mjs
          node --check v3/web/modules/workspace.mjs
          node --test v3/tests/workspace.test.mjs v3/tests/company-ui.test.mjs v3/tests/company-handoff-ui.test.mjs
          git diff --exit-code 0a37067969273a3a16aaf282dc0caf85939e012d -- supabase v3/web/modules/vault.mjs v3/web/modules/api.mjs
      - name: Commit only application sources, tests and public manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md docs v3/web v3/scripts/build.mjs v3/tests/company-ui.test.mjs v3/tests/company-handoff-ui.test.mjs v3/tests/company-browser.py v3/tests/company-native-browser.py v3/tests/live-native-browser.py v3/direct/browser.py
          if ! git diff --cached --quiet; then git commit -m '重整五個西文工作區；對照手冊與擁有者資訊不發布';git push origin HEAD:ui/v2-style-spanish-workspace;fi
