name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ACCEPTED: d548f089951b8b926262b5b77670082cb5942dd5
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PULSO_ENVIRONMENT: company-3.1.1-handoff-awaiting-module-013
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact native acceptance and unchanged runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36335951091 > /tmp/company-accepted.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/company-accepted.json'))
          assert r['head_sha']==os.environ['ACCEPTED'] and r['status']=='completed' and r['conclusion']=='success'
          PY
          git fetch --no-tags --depth=1 origin "$ACCEPTED"
          git diff --exit-code "$ACCEPTED" HEAD -- supabase v3/web v3/live v3/scripts ':!v3/web/manual-es.html' ':!v3/web/manual-es-zh.html'
      - name: Check source and preserve V2 frontend
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          node --test tests/*.cjs
          python tests/import_package_test.py
          node scripts/prepare-web.mjs
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs
          node v3/tests/company.mjs
          node v3/tests/company-handoff.mjs
      - name: Build matching company field App, monitor and test center
        run: |
          python docs/build-company-manuals.py
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
          mkdir -p web/v3 web/v3-demo /tmp/pulso-company-release
          cp -a v3/dist/. web/v3/
          cp -a v3/preview/. web/v3-demo/
          node v3/live/build.mjs
          node scripts/prepare-pruebas.mjs
          python - <<'PY'
          import pathlib,json,subprocess,hashlib,re
          es=pathlib.Path('web/v3/manual-es.html').read_text();bi=pathlib.Path('web/v3/manual-es-zh.html').read_text()
          assert 'MANUAL 3.1.1' in es and 'MANUAL 3.1.1' in bi
          assert not re.search('[\u3400-\u9fff]',es)
          assert len(re.findall(r'<section id="s\d+',es))==26 and len(re.findall(r'<section id="s\d+',bi))==26
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files={str(p.relative_to('web')):hashlib.sha256(p.read_bytes()).hexdigest() for p in [pathlib.Path('web/v3/app.js'),pathlib.Path('web/v3/manual-es.html'),pathlib.Path('web/v3/manual-es-zh.html')]}
          result={'version':'3.1.1','source_commit':commit,'accepted_runtime':'d548f089951b8b926262b5b77670082cb5942dd5','native_acceptance_run':36335951091,'database_migration_executed':False,'super_admin_production_grant_verified':False,'required_database_module':13,'confirmation_responsibility':'company_admin','company_approval_created_by_deploy':False,'physical_device_certification':False,'hosting_scope':'existing preview; commercial hosting suitability requires owner review','files':files}
          pathlib.Path('web/company-release.json').write_text(json.dumps(result,indent=2));pathlib.Path('/tmp/pulso-company-release/company-release.json').write_text(json.dumps(result,indent=2))
          PY
          git archive --format=zip HEAD -o /tmp/pulso-company-release/source.zip
          tar -C web/v3 -czf /tmp/pulso-company-release/company-frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-company-release/company-demo.tar.gz .
          cp supabase/V3_1_COMPANY_UPGRADE.sql supabase/V3_1_1_COMPANY_HANDOFF.sql /tmp/pulso-company-release/
          echo '公司3.1.1前端已建置。三項確認由公司Admin填寫；未執行正式013、未代填證據、未開收、未新增付費資源。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-company-release
          path: /tmp/pulso-company-release/
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Chromium for public route checks
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Confirm deployed company, manuals and protected routes without production login
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,time,pathlib,urllib.request,hashlib,re
          from playwright.sync_api import sync_playwright
          base='https://jaimehuang168.github.io/pulso-alto-parana-2026/'
          for attempt in range(30):
            try:
              release=json.load(urllib.request.urlopen(base+'company-release.json?at='+str(time.time()),timeout=15))
              if release['version']=='3.1.1' and release['accepted_runtime']=='d548f089951b8b926262b5b77670082cb5942dd5':break
            except Exception:pass
            time.sleep(3)
          else:raise RuntimeError('Expected company release not published')
          checks=[]
          for path,sha in release['files'].items():
            content=urllib.request.urlopen(base+path+'?check='+release['source_commit'],timeout=20).read();assert hashlib.sha256(content).hexdigest()==sha
            checks.append({'name':'Published hash '+path,'pass':True})
          with sync_playwright() as p:
            browser=p.chromium.launch();ctx=browser.new_context(viewport={'width':390,'height':844});page=ctx.new_page()
            for route in ['', 'v3/']:
              assert page.goto(base+route).status==200;page.locator('#login-form').wait_for(timeout=30000);checks.append({'name':'Private login '+route,'pass':True})
            for route,selector in [('live/','#access:not([hidden]) #login-form'),('live/control.html','#access:not([hidden]) #login')]:
              assert page.goto(base+route).status==200;page.locator(selector).wait_for(timeout=20000);checks.append({'name':'Protected live route '+route,'pass':True})
            page.route('**/*.supabase.co/**',lambda route:route.abort())
            page.goto(base+'v3-demo/');page.get_by_role('button',name='Administrador',exact=True).wait_for(timeout=120000);page.get_by_role('button',name='Administrador',exact=True).click();page.get_by_role('heading',name='Centro de operación').wait_for(timeout=45000)
            page.locator('#mobile-nav').select_option('company');page.locator('#company-form').wait_for();assert 'Super Admin' in page.locator('body').inner_text();assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
            page.locator('[data-company-readiness]').wait_for();assert page.locator('#company-readiness-form').count()==0 and page.locator('[data-action=activate]').count()==0;assert 'Super Admin no debe completar' in page.locator('[data-company-readiness]').inner_text()
            page.screenshot(path='evidence/company-demo-mobile.png',full_page=True);checks.append({'name':'Super Admin has status only; no attestation form or old activate modal','pass':True})
            for name in ['manual-es.html','manual-es-zh.html']:
              assert page.goto(base+'v3/'+name).status==200;assert page.locator('section[id^=s]').count()==26;checks.append({'name':'Complete manual '+name,'pass':True})
            page.goto(base+'pruebas/?v=2');page.locator('#storage-retry').wait_for(timeout=20000) if page.locator('#storage-retry').count() else page.get_by_role('button',name='Repetir solo almacenamiento').wait_for(timeout=20000)
            checks.append({'name':'Storage diagnostic entry retained','pass':True});browser.close()
          pathlib.Path('evidence/company-published.json').write_text(json.dumps({'scope':'Public routes and isolated demo only; no production login, migration or survey write','release':release,'passed':len(checks),'failed':0,'checks':checks},indent=2));print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-company-published
          path: evidence/
          retention-days: 14
