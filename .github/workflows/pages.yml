name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ACCEPTED: d49b486d4970e8e4e6c3b14b2a34f162950919b2
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PULSO_ENVIRONMENT: workspace-3.1.3
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require native acceptance and unchanged reviewed runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36352261549 > /tmp/workspace-accepted.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/workspace-accepted.json'))
          assert r['head_sha']==os.environ['ACCEPTED'] and r['status']=='completed' and r['conclusion']=='success'
          PY
          git fetch --no-tags --depth=1 origin "$ACCEPTED"
          git diff --exit-code "$ACCEPTED" HEAD -- supabase v3/web v3/live v3/scripts scripts ':!v3/web/manual-es.html'
      - name: Verify complete pure regressions and public language
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          node --test tests/*.cjs
          python tests/import_package_test.py
          node scripts/prepare-web.mjs
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs
          python docs/build-company-manuals.py
      - name: Build Spanish workspaces, monitor and existing test tools
        run: |
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
          rm -rf web/v3 web/v3-demo
          mkdir -p web/v3 web/v3-demo /tmp/pulso-workspace-release
          cp -a v3/dist/. web/v3/
          cp -a v3/preview/. web/v3-demo/
          node v3/live/build.mjs
          node scripts/prepare-pruebas.mjs
          python - <<'PY'
          import pathlib,json,subprocess,hashlib,re
          paths=['v3','v3-demo','pruebas/ensayo/v3']
          for root in paths:
            p=pathlib.Path('web')/root
            assert not (p/'manual-es-zh.html').exists()
            text=(p/'manual-es.html').read_text();assert text.count('<section id="s')==26
            assert not re.search('[\u3400-\u9fff]|Super Admin|jaimehuang168@gmail',text)
          assert not pathlib.Path('web/pruebas/guia-zh.html').exists()
          for f in ['web/pruebas/index.html','web/pruebas/ensayo/index.html']:
            assert not re.search('[\u3400-\u9fff]',pathlib.Path(f).read_text())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files={f:hashlib.sha256((pathlib.Path('web')/f).read_bytes()).hexdigest() for f in ['v3/app.js','v3/workspace.css','v3/manual-es.html']}
          report={'version':'3.1.3','source_commit':commit,'accepted_runtime':'d49b486d4970e8e4e6c3b14b2a34f162950919b2','native_acceptance_run':36352261549,'database_changed':False,'new_sql_required':False,'physical_device_certification':False,'private_manual_published':False,'public_language':'es','files':files}
          pathlib.Path('web/company-release.json').write_text(json.dumps(report,indent=2));pathlib.Path('/tmp/pulso-workspace-release/company-release.json').write_text(json.dumps(report,indent=2))
          PY
          git archive --format=zip HEAD -o /tmp/pulso-workspace-release/source.zip
          tar -C web/v3 -czf /tmp/pulso-workspace-release/workspace-frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-workspace-release/workspace-demo.tar.gz .
          echo 'Five Spanish work areas published; no schema, permissions, production votes or paid resources changed. Private bilingual manual is excluded.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-workspace-release
          path: /tmp/pulso-workspace-release/
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser for public-route checks
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify released work areas, Spanish manual and removed private routes
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,time,pathlib,urllib.request,urllib.error,hashlib,re
          from playwright.sync_api import sync_playwright
          base='https://jaimehuang168.github.io/pulso-alto-parana-2026/'
          for attempt in range(30):
            try:
              release=json.load(urllib.request.urlopen(base+'company-release.json?at='+str(time.time()),timeout=15))
              if release['version']=='3.1.3' and release['accepted_runtime']=='d49b486d4970e8e4e6c3b14b2a34f162950919b2':break
            except Exception:pass
            time.sleep(3)
          else:raise RuntimeError('Expected workspace release not published')
          checks=[]
          def check(name,ok):
            assert ok,name
            checks.append({'name':name,'pass':True})
          for route,sha in release['files'].items():
            content=urllib.request.urlopen(base+route+'?check='+release['source_commit'],timeout=20).read();check('Published hash '+route,hashlib.sha256(content).hexdigest()==sha)
          for route in ['v3/manual-es-zh.html','v3-demo/manual-es-zh.html','pruebas/ensayo/v3/manual-es-zh.html','pruebas/guia-zh.html']:
            try:
              urllib.request.urlopen(base+route+'?check='+release['source_commit'],timeout=20);status=200
            except urllib.error.HTTPError as e:status=e.code
            check('Removed private route '+route,status==404)
          with sync_playwright() as p:
            browser=p.chromium.launch();ctx=browser.new_context(viewport={'width':1440,'height':1100});page=ctx.new_page()
            for route in ['', 'v3/']:
              check('Route '+route,page.goto(base+route).status==200);page.locator('#login-form').wait_for(timeout=30000)
            for route,selector in [('live/','#access:not([hidden]) #login-form'),('live/control.html','#access:not([hidden]) #login')]:
              check('Protected monitor '+route,page.goto(base+route).status==200);page.locator(selector).wait_for(timeout=20000)
            page.route('**/*.supabase.co/**',lambda route:route.abort())
            page.goto(base+'v3-demo/');page.get_by_role('button',name='Admin de empresa',exact=True).wait_for(timeout=120000);page.get_by_role('button',name='Admin de empresa',exact=True).click();page.get_by_role('heading',name='Resultados',exact=True).wait_for(timeout=45000)
            check('Five primary work areas',page.locator('.sidebar nav [data-group]').count()==5)
            check('Interface is Spanish without owner banner',not re.search('[\u3400-\u9fff]|Super Admin|jaimehuang168@gmail',page.locator('body').inner_text()))
            check('Four city result cards',page.locator('.city-card').count()==4)
            page.screenshot(path='evidence/workspace-results.png',full_page=True)
            page.set_viewport_size({'width':390,'height':844});check('Mobile layout and bottom navigation',page.evaluate('document.documentElement.scrollWidth<=innerWidth+1') and page.locator('.mobilebottom [data-group]:visible').count()==5);page.screenshot(path='evidence/workspace-mobile.png',full_page=True)
            page.locator('[data-action=nav][data-id=people]:visible').first.click();page.locator('.responsive-table').wait_for();page.screenshot(path='evidence/workspace-equipo.png',full_page=False)
            check('Spanish public manual route',page.goto(base+'v3/manual-es.html').status==200);check('26 complete Spanish manual sections',page.locator('section[id^=s]').count()==26 and not re.search('[\u3400-\u9fff]|Super Admin',page.locator('body').inner_text()))
            for route in ['pruebas/','pruebas/ensayo/']:
              check('Spanish test entry '+route,page.goto(base+route).status==200 and not re.search('[\u3400-\u9fff]',page.locator('body').inner_text()))
            page.goto(base+'pruebas/?v=2');page.get_by_role('button',name='Repetir solo almacenamiento').wait_for(timeout=20000);check('Storage diagnostic retained',True)
            browser.close()
          pathlib.Path('evidence/workspace-published.json').write_text(json.dumps({'scope':'Published hashes, public routes and isolated synthetic demo. No production login or survey write.','release':release,'passed':len(checks),'failed':0,'checks':checks},indent=2));print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-workspace-published
          path: evidence/
          retention-days: 14
