name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ACCEPTED: 8c06c04d21cf40e362cc4a2c1f3e5745bcd51902
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PULSO_ENVIRONMENT: company-3.1.2-direct-use-awaiting-owner-install
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify exact native acceptance and unchanged runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36339186759 > /tmp/company-accepted.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/company-accepted.json'))
          assert r['head_sha']==os.environ['ACCEPTED'] and r['status']=='completed' and r['conclusion']=='success'
          PY
          git fetch --no-tags --depth=1 origin "$ACCEPTED"
          git diff --exit-code "$ACCEPTED" HEAD -- supabase v3/web v3/live v3/scripts ':!v3/web/manual-es.html' ':!v3/web/manual-es-zh.html'
      - name: Check source and preserve original frontend
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          node --test tests/*.cjs
          python tests/import_package_test.py
          node scripts/prepare-web.mjs
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs
          node v3/tests/company.mjs
          node v3/tests/direct-use.mjs
      - name: Build role-based App, monitor, manuals and test center
        run: |
          python docs/build-company-manuals.py
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
          mkdir -p web/v3 web/v3-demo /tmp/pulso-direct-release
          cp -a v3/dist/. web/v3/
          cp -a v3/preview/. web/v3-demo/
          node v3/live/build.mjs
          node scripts/prepare-pruebas.mjs
          python - <<'PY'
          import pathlib,json,subprocess,hashlib,re
          es=pathlib.Path('web/v3/manual-es.html').read_text();bi=pathlib.Path('web/v3/manual-es-zh.html').read_text()
          assert 'MANUAL 3.1.2' in es and 'MANUAL 3.1.2' in bi
          assert not re.search('[\u3400-\u9fff]',es)
          assert len(re.findall(r'<section id="s\d+',es))==26 and len(re.findall(r'<section id="s\d+',bi))==26
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          files={str(p.relative_to('web')):hashlib.sha256(p.read_bytes()).hexdigest() for p in [pathlib.Path('web/v3/app.js'),pathlib.Path('web/v3/manual-es.html'),pathlib.Path('web/v3/manual-es-zh.html')]}
          result={'version':'3.1.2','source_commit':commit,'accepted_runtime':'8c06c04d21cf40e362cc4a2c1f3e5745bcd51902','native_acceptance_run':36339186759,'database_migration_executed':False,'hosted_module_013_verified_by_deploy':False,'required_database_module':14,'activation_step_in_app':False,'physical_device_certification':False,'hosting_scope':'existing preview; commercial hosting suitability requires owner review','files':files}
          pathlib.Path('web/company-release.json').write_text(json.dumps(result,indent=2));pathlib.Path('/tmp/pulso-direct-release/release.json').write_text(json.dumps(result,indent=2))
          PY
          git archive --format=zip HEAD -o /tmp/pulso-direct-release/source.zip
          tar -C web/v3 -czf /tmp/pulso-direct-release/frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-direct-release/demo.tar.gz .
          cp supabase/V3_1_DIRECT_USE.sql /tmp/pulso-direct-release/
          echo '直接使用版：App不再要求Activate。正式013判定與014部署仍由Super Admin一次執行。未代填證據、未開收、未新增付費資源。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-direct-release
          path: /tmp/pulso-direct-release/
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser for public route checks
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify static routes and isolated direct-use demonstration
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,time,pathlib,urllib.request,hashlib
          from playwright.sync_api import sync_playwright
          base='https://jaimehuang168.github.io/pulso-alto-parana-2026/'
          for attempt in range(30):
            try:
              release=json.load(urllib.request.urlopen(base+'company-release.json?at='+str(time.time()),timeout=15))
              if release['version']=='3.1.2' and release['accepted_runtime']=='8c06c04d21cf40e362cc4a2c1f3e5745bcd51902':break
            except Exception:pass
            time.sleep(3)
          else:raise RuntimeError('Expected direct-use release not published')
          checks=[]
          for path,sha in release['files'].items():
            content=urllib.request.urlopen(base+path+'?check='+release['source_commit'],timeout=20).read();assert hashlib.sha256(content).hexdigest()==sha
            checks.append({'name':'Published hash '+path,'pass':True})
          with sync_playwright() as p:
            browser=p.chromium.launch();ctx=browser.new_context(viewport={'width':390,'height':844});page=ctx.new_page()
            # Only static unauthenticated pages and fully isolated synthetic demo are opened.
            page.route('**/*.supabase.co/**',lambda route:route.abort())
            for route in ['', 'v3/']:
              assert page.goto(base+route).status==200;page.locator('#login-form').wait_for(timeout=30000);checks.append({'name':'Private login '+route,'pass':True})
            for route,selector in [('live/','#access:not([hidden]) #login-form'),('live/control.html','#access:not([hidden]) #login')]:
              assert page.goto(base+route).status==200;page.locator(selector).wait_for(timeout=20000);checks.append({'name':'Protected live route '+route,'pass':True})
            for role in ['Administrador','Admin de empresa']:
              page.goto(base+'v3-demo/');page.get_by_role('button',name=role,exact=True).wait_for(timeout=120000);page.get_by_role('button',name=role,exact=True).click();page.get_by_role('heading',name='Centro de operación').wait_for(timeout=45000)
              page.locator('#mobile-nav').select_option('company');page.locator('#company-form').wait_for();page.get_by_text('Acceso directo V3.1',exact=True).wait_for(timeout=20000)
              assert page.locator('#company-readiness-form,[data-action=activate],[data-action=company-activate]').count()==0
              assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
              page.screenshot(path='evidence/direct-'+('owner' if role=='Administrador' else 'company')+'-mobile.png',full_page=True)
              checks.append({'name':role+' uses direct V3.1 with no activation form','pass':True})
              page.locator('[data-action=logout]:visible').first.click()
            for name in ['manual-es.html','manual-es-zh.html']:
              assert page.goto(base+'v3/'+name).status==200;assert page.locator('section[id^=s]').count()==26;checks.append({'name':'Complete updated manual '+name,'pass':True})
            page.goto(base+'pruebas/?v=2');page.get_by_role('button',name='Repetir solo almacenamiento').wait_for(timeout=20000)
            checks.append({'name':'Storage diagnosis retained','pass':True});browser.close()
          pathlib.Path('evidence/direct-published.json').write_text(json.dumps({'scope':'Static pages and isolated browser-local demo; hosted Supabase requests blocked; no production login, migration or survey write','release':release,'passed':len(checks),'failed':0,'checks':checks},indent=2));print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-direct-published
          path: evidence/
          retention-days: 14
