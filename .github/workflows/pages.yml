name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check original V2 source and public configuration
        id: check
        env:
          PROJECT_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [ ! -f web/app.js ] || [ ! -f tests/core.test.cjs ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '原始 V2 程式不完整；不發布。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --check web/app.js
          node --check web/core.js
          node --check scripts/continue-deploy-zh.mjs
          node --test tests/*.cjs
          python tests/import_package_test.py
          if [ -z "$PROJECT_URL" ] || [ -z "$PUBLIC_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '缺少公開連線設定，不發布。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve and prepare original private V2 frontend
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/prepare-web.mjs
      - name: Verify exact V3 source passed all native gates
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/35992246330 > /tmp/v3-accepted-run.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v3-accepted-run.json'))
          assert r['head_sha']=='fcb9187f556369a1437af24c96b67cad25e67653'
          assert r['status']=='completed' and r['conclusion']=='success'
          PY
      - uses: actions/checkout@v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: fcb9187f556369a1437af24c96b67cad25e67653
          path: v3-candidate
          persist-credentials: false
      - name: Build pinned V3 without modifying the production database
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PULSO_ENVIRONMENT: hosted-v3-awaiting-owner-activation
        run: |
          npm --prefix v3-candidate/v3 ci
          node v3-candidate/v3/scripts/check.mjs
          node --test v3-candidate/v3/tests/*.test.mjs
          node v3-candidate/v3/scripts/fetch-vendor.mjs
          node v3-candidate/v3/scripts/build.mjs --demo
          node v3-candidate/v3/scripts/build.mjs
          mkdir -p web/v3 web/v3-demo /tmp/pulso-v3-release
          cp -a v3-candidate/v3/dist/. web/v3/
          cp -a v3-candidate/v3/preview/. web/v3-demo/
          git -C v3-candidate archive --format=zip HEAD -o /tmp/pulso-v3-release/source.zip
          git -C v3-candidate rev-parse HEAD > /tmp/pulso-v3-release/SOURCE_SHA.txt
          tar -C web/v3 -czf /tmp/pulso-v3-release/private-frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-v3-release/isolated-demo.tar.gz .
          python - <<'PY'
          import json,pathlib
          data={'version':'3.0.0-rc.1','source_commit':'fcb9187f556369a1437af24c96b67cad25e67653','native_run':35992246330,'root_v2_preserved':True,'v3_production_database_automatically_migrated':False,'v3_url_requires_owner_install_and_activation':True,'demo_uses_only_browser_local_synthetic_data':True}
          pathlib.Path('web/v3-release.json').write_text(json.dumps(data,indent=2))
          pathlib.Path('/tmp/pulso-v3-release/release.json').write_text(json.dumps(data,indent=2))
          PY
          echo '原始 V2 根目錄保留。V3 靜態入口不等於正式後端已升級；展示版不連接正式資料庫。' >> "$GITHUB_STEP_SUMMARY"
      - name: Build read-only live monitor and isolated synthetic live demonstration
        if: steps.check.outputs.ready == 'true'
        run: |
          npm --prefix v3 ci
          node --test v3/tests/live-core.test.mjs
          node v3/tests/live-board.mjs
          node v3/live/build.mjs
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          d={'feature':'pulso-live-1','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'backend_changed_by_this_deploy':False,'required_migrations':[9,10],'live_demo_is_synthetic':True}
          d['files']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for folder in ['web/live','web/live-demo'] for p in pathlib.Path(folder).iterdir() if p.is_file()}
          pathlib.Path('web/live-release.json').write_text(json.dumps(d,indent=2))
          PY
          echo '新增 /live/ 與 /live-demo/。不執行正式SQL、不開收、不變更發布授權。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        if: steps.check.outputs.ready == 'true'
        with:
          name: pulso-v3-delivery-source-and-frontends
          path: /tmp/pulso-v3-release/
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
        if: steps.check.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.check.outputs.ready == 'true'
        with:
          path: web
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preserved V2 and separate V3 entry points
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Report deployment boundary
        run: echo '前端已發布。正式Supabase增量安裝、備份及實體手機驗收仍需獨立完成。' >> "$GITHUB_STEP_SUMMARY"
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser for public deployment verification
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify published routes without logging into production
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,time,pathlib,urllib.request
          from playwright.sync_api import sync_playwright
          base='https://jaimehuang168.github.io/pulso-alto-parana-2026/'
          for n in range(30):
            try:
              r=json.load(urllib.request.urlopen(base+'v3-release.json?check='+str(time.time()),timeout=15))
              live=json.load(urllib.request.urlopen(base+'live-release.json?check='+str(time.time()),timeout=15))
              if r['source_commit']=='fcb9187f556369a1437af24c96b67cad25e67653' and live['feature']=='pulso-live-1':break
            except Exception:pass
            time.sleep(3)
          else:raise RuntimeError('The release manifests are not published yet')
          checks=[]
          with sync_playwright() as p:
            browser=p.chromium.launch()
            context=browser.new_context(viewport={'width':390,'height':844})
            page=context.new_page()
            response=page.goto(base,wait_until='domcontentloaded');page.locator('#login-form').wait_for(timeout=30000)
            assert response.status==200;checks.append({'name':'Original V2 login remains published','pass':True})
            response=page.goto(base+'v3/',wait_until='domcontentloaded');page.locator('#login-form').wait_for(timeout=30000)
            assert response.status==200 and page.get_by_role('button',name='Administrador',exact=True).count()==0
            checks.append({'name':'V3 private login still renders','pass':True})
            page.route('**/*.supabase.co/**',lambda route:route.abort())
            response=page.goto(base+'v3-demo/',wait_until='domcontentloaded');assert response.status==200
            page.get_by_role('button',name='Administrador',exact=True).wait_for(timeout=120000)
            page.get_by_role('button',name='Administrador',exact=True).click()
            page.get_by_role('heading',name='Centro de operación',exact=True).wait_for(timeout=45000)
            assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1')
            page.screenshot(path='evidence/v3-demo-admin-mobile.png',full_page=True)
            checks.append({'name':'Existing V3 demo admin still operates','pass':True})
            page.locator('[data-action="logout"]:visible').first.click()
            page.get_by_role('button',name='Viewer CDE',exact=True).click()
            page.get_by_role('heading',name='Acceso a resultados pendiente',exact=True).wait_for(timeout=20000)
            checks.append({'name':'Existing demo Viewer remains restricted','pass':True})
            page.set_viewport_size({'width':1920,'height':1080})
            response=page.goto(base+'live-demo/',wait_until='domcontentloaded');assert response.status==200
            page.locator('.city-card').first.wait_for(timeout=20000)
            assert page.locator('.city-card').count()==4
            assert page.evaluate("document.documentElement.scrollHeight<=innerHeight+1 && [...document.querySelectorAll('.candidate-list')].every(e=>e.scrollHeight<=e.clientHeight+1)")
            checks.append({'name':'Published live four-city monitor fits one 1080p screen','pass':True})
            page.screenshot(path='evidence/live-four-cities.png',full_page=True)
            before=page.locator('[data-city=cde] .metric b').first.inner_text()
            page.wait_for_timeout(6200)
            assert before!=page.locator('[data-city=cde] .metric b').first.inner_text()
            checks.append({'name':'Published synthetic counts update without ending the survey','pass':True})
            page.locator('button[data-city=minga]').click()
            assert page.locator('.city-card').count()==1 and page.locator('.candidate-line').count()==4
            checks.append({'name':'Published single-city selection works','pass':True})
            page.goto(base+'live/',wait_until='domcontentloaded');page.locator('#access:not([hidden]) #login-form').wait_for(timeout=20000)
            assert page.locator('.candidate-line').count()==0
            checks.append({'name':'Private live route demands login and never substitutes demo answers','pass':True})
            browser.close()
          pathlib.Path('evidence/published-smoke.json').write_text(json.dumps({'scope':'Published static routes and synthetic browser demos only; no production login or writes','source_commit':live['source_commit'],'passed':len(checks),'failed':0,'checks':checks},indent=2))
          print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-v3-published-smoke
          path: evidence/
          retention-days: 14
