name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check original V2 source and public configuration
        id: check
        env:
          PROJECT_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ ! -f web/app.js ] || [ ! -f tests/core.test.cjs ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '原始 V2 程式不完整；不發布。' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --check web/app.js
          node --check web/core.js
          node --check scripts/continue-deploy-zh.mjs
          node --test tests/*.cjs
          python tests/import_package_test.py
          if [ -z "$PROJECT_URL" ] || [ -z "$PUBLIC_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '缺少公開連線設定，不發布。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve and prepare original private V2 frontend
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/prepare-web.mjs
      - name: Verify exact native and targeted acceptance before publishing
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36172071677 > /tmp/native-accepted.json
          gh api repos/${{ github.repository }}/actions/runs/36172069029 > /tmp/targeted-accepted.json
          python - <<'PY'
          import json
          for path in ['/tmp/native-accepted.json','/tmp/targeted-accepted.json']:
            r=json.load(open(path));assert r['head_sha']=='73c7de56b61490f26042b754c790a8bebd5be4d6' and r['status']=='completed' and r['conclusion']=='success'
          PY
          git fetch --no-tags --depth=1 origin 73c7de56b61490f26042b754c790a8bebd5be4d6
          git diff --exit-code 73c7de56b61490f26042b754c790a8bebd5be4d6 HEAD -- v3/web v3/live v3/package.json v3/package-lock.json supabase/migrations supabase/functions supabase/V3_UPGRADE_EXISTING.sql web/pruebas scripts/prepare-pruebas.mjs
      - uses: actions/checkout@v7.0.1
        if: steps.check.outputs.ready == 'true'
        with:
          ref: 73c7de56b61490f26042b754c790a8bebd5be4d6
          path: v3-candidate
          persist-credentials: false
      - name: Build accepted V3 without modifying the production database
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PULSO_ENVIRONMENT: hosted-v3-awaiting-owner-activation
        run: |
          npm --prefix v3-candidate/v3 ci
          node v3-candidate/v3/scripts/check.mjs
          node --test v3-candidate/v3/tests/*.test.mjs
          node v3-candidate/v3/scripts/fetch-vendor.mjs
          node v3-candidate/v3/scripts/build.mjs --demo
          node v3-candidate/v3/scripts/build.mjs
          mkdir -p web/v3 web/v3-demo /tmp/pulso-v3-release
          cp -a v3-candidate/v3/dist/. web/v3/
          cp -a v3-candidate/v3/preview/. web/v3-demo/
          git -C v3-candidate archive --format=zip HEAD -o /tmp/pulso-v3-release/source.zip
          git -C v3-candidate rev-parse HEAD > /tmp/pulso-v3-release/SOURCE_SHA.txt
          tar -C web/v3 -czf /tmp/pulso-v3-release/private-frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-v3-release/isolated-demo.tar.gz .
          python - <<'PY'
          import json,pathlib
          data={'version':'3.0.0-rc.1','display_timezone_fix':'py-utc-3','source_commit':'73c7de56b61490f26042b754c790a8bebd5be4d6','native_run':36172071677,'targeted_run':36172069029,'root_v2_preserved':True,'v3_production_database_automatically_migrated':False,'v3_url_requires_owner_install_and_activation':True,'demo_uses_only_browser_local_synthetic_data':True}
          pathlib.Path('web/v3-release.json').write_text(json.dumps(data,indent=2));pathlib.Path('/tmp/pulso-v3-release/release.json').write_text(json.dumps(data,indent=2))
          PY
      - name: Build accepted live monitor and administrator console
        if: steps.check.outputs.ready == 'true'
        run: |
          npm --prefix v3 ci
          node --test v3/tests/*.test.mjs
          node v3/tests/live-board.mjs
          node v3/tests/live-console-sql.mjs
          node v3/live/build.mjs
          python - <<'PY'
          import json,pathlib,subprocess,hashlib
          d={'feature':'pulso-live-2','accepted_source':'73c7de56b61490f26042b754c790a8bebd5be4d6','native_acceptance_run':36172071677,'targeted_acceptance_run':36172069029,'display_timezone':'UTC-03:00','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'backend_changed_by_this_deploy':False,'required_migrations':[9,10,11],'live_demo_is_synthetic':True,'physical_device_acceptance_completed':False}
          d['files']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for folder in ['web/live','web/live-demo'] for p in pathlib.Path(folder).iterdir() if p.is_file()}
          pathlib.Path('web/live-release.json').write_text(json.dumps(d,indent=2));pathlib.Path('/tmp/pulso-v3-release/live-release.json').write_text(json.dumps(d,indent=2))
          PY
          git archive --format=zip HEAD -o /tmp/pulso-v3-release/live-source.zip
          tar -C web/live -czf /tmp/pulso-v3-release/live-private-frontend.tar.gz .
          tar -C web/live-demo -czf /tmp/pulso-v3-release/live-synthetic-demo.tar.gz .
      - name: Prepare hands-on test center with no new cloud resources
        if: steps.check.outputs.ready == 'true'
        run: |
          node scripts/prepare-pruebas.mjs
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          PULSO_TEST_EVIDENCE=/tmp/pulso-v3-release/readiness-tests python tests/quick-readiness-browser.py
          tar -C web/pruebas -czf /tmp/pulso-v3-release/pruebas-entry.tar.gz .
          echo '分階段診斷與UTC-3顯示已建置；不改正式SQL、收件、授權或費用設定。' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        if: always() && steps.check.outputs.ready == 'true'
        with:
          name: pulso-v3-delivery-source-and-frontends
          path: /tmp/pulso-v3-release/
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
        if: steps.check.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.check.outputs.ready == 'true'
        with:
          path: web
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish preserved V2 and independent V3/live routes
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Report deployment boundary
        run: echo '前端發布完成；沒有變更正式Supabase，沒有代替實體手機驗收。' >> "$GITHUB_STEP_SUMMARY"
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser for published-route verification
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify public routes, storage diagnosis and displayed clock
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,time,pathlib,urllib.request,hashlib,datetime
          from playwright.sync_api import sync_playwright
          base='https://jaimehuang168.github.io/pulso-alto-parana-2026/';accepted='73c7de56b61490f26042b754c790a8bebd5be4d6'
          for n in range(30):
            try:
              r=json.load(urllib.request.urlopen(base+'v3-release.json?check='+str(time.time()),timeout=15))
              live=json.load(urllib.request.urlopen(base+'live-release.json?check='+str(time.time()),timeout=15))
              if r['source_commit']==accepted and live['accepted_source']==accepted:break
            except Exception:pass
            time.sleep(3)
          else:raise RuntimeError('The accepted release manifests are not published yet')
          checks=[]
          for path in ['web/live/live.js','web/live/control.js','web/live/control.css','web/live/control.html']:
            body=urllib.request.urlopen(base+path.removeprefix('web/')+'?verify='+live['source_commit'],timeout=20).read();assert hashlib.sha256(body).hexdigest()==live['files'][path]
          checks.append({'name':'Live and console assets match the accepted release hashes','pass':True})
          with sync_playwright() as p:
            browser=p.chromium.launch();context=browser.new_context(viewport={'width':390,'height':844},accept_downloads=True);page=context.new_page()
            response=page.goto(base,wait_until='domcontentloaded');page.locator('#login-form').wait_for(timeout=30000);assert response.status==200
            checks.append({'name':'Original V2 login remains published','pass':True})
            response=page.goto(base+'v3/',wait_until='domcontentloaded');page.locator('#login-form').wait_for(timeout=30000);assert response.status==200 and page.get_by_role('button',name='Administrador',exact=True).count()==0
            checks.append({'name':'V3 private login renders without synthetic fallback','pass':True})
            page.route('**/*.supabase.co/**',lambda route:route.abort())
            response=page.goto(base+'v3-demo/',wait_until='domcontentloaded');assert response.status==200
            page.get_by_role('button',name='Administrador',exact=True).wait_for(timeout=120000);page.get_by_role('button',name='Administrador',exact=True).click();page.get_by_role('heading',name='Centro de operación',exact=True).wait_for(timeout=45000)
            assert page.evaluate('document.documentElement.scrollWidth <= innerWidth+1');checks.append({'name':'V3 synthetic admin demo works with hosted API blocked','pass':True})
            page.locator('[data-action="logout"]:visible').first.click();page.get_by_role('button',name='Viewer CDE',exact=True).click();page.get_by_role('heading',name='Acceso a resultados pendiente',exact=True).wait_for(timeout=20000)
            checks.append({'name':'Synthetic Viewer remains restricted','pass':True})
            page.set_viewport_size({'width':1920,'height':1080});response=page.goto(base+'live-demo/',wait_until='domcontentloaded');assert response.status==200
            page.locator('.city-card').first.wait_for(timeout=20000);assert page.locator('.city-card').count()==4
            assert page.evaluate("document.documentElement.scrollHeight<=innerHeight+1 && [...document.querySelectorAll('.candidate-list')].every(e=>e.scrollHeight<=e.clientHeight+1)")
            checks.append({'name':'Published four-city monitor fits 1080p','pass':True});page.screenshot(path='evidence/LIVE_4_CIUDADES_DEMO.png',full_page=True)
            before=page.locator('[data-city=cde] .metric b').first.inner_text();page.wait_for_timeout(6200);assert before!=page.locator('[data-city=cde] .metric b').first.inner_text()
            checks.append({'name':'Published counts update while screen stays open','pass':True})
            page.set_viewport_size({'width':3840,'height':2160});assert float(page.locator('.candidate-name').first.evaluate('e=>getComputedStyle(e).fontSize').replace('px',''))>=38
            checks.append({'name':'4K candidate text scales up','pass':True});page.screenshot(path='evidence/LIVE_4K_DEMO.png',full_page=True)
            page.set_viewport_size({'width':1920,'height':1080});page.locator('button[data-city=minga]').click();assert page.locator('.city-card').count()==1 and page.locator('.candidate-line').count()==4
            checks.append({'name':'Published single-city selection works','pass':True});page.screenshot(path='evidence/LIVE_MINGA_DEMO.png',full_page=True)
            page.set_viewport_size({'width':390,'height':844});assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1');page.screenshot(path='evidence/LIVE_MOVIL_DEMO.png',full_page=True)
            page.locator('button[data-city=all]').click();assert page.locator('.city-card').count()==4;assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
            checks.append({'name':'Phone layout retains four independently updating cards','pass':True})
            page.goto(base+'live/',wait_until='domcontentloaded');page.locator('#access:not([hidden]) #login-form').wait_for(timeout=20000);assert page.locator('.candidate-line').count()==0
            checks.append({'name':'Private live route requires login','pass':True})
            page.goto(base+'live/control.html',wait_until='domcontentloaded');page.locator('#access:not([hidden]) #login').wait_for(timeout=20000);assert page.locator('#workspace').is_hidden() and page.locator('.mapping-row').count()==0
            checks.append({'name':'Private console requires administrator login','pass':True})
            page.goto(base+'pruebas/?check=pruebas-2',wait_until='domcontentloaded');page.locator('#storage-check').wait_for(timeout=20000);assert 'PRUEBAS 2' in page.locator('header small').inner_text()
            page.locator('#storage-check').click();page.wait_for_function("document.querySelector('#message').textContent.startsWith('Almacenamiento y limpieza conformes')",timeout=30000)
            assert page.locator('#storage-details article.pass').count()==6
            with page.expect_download() as download:page.locator('#export').click()
            download.value.save_as('evidence/published-storage-result.json');d=json.load(open('evidence/published-storage-result.json'))
            assert d['schema']=='pulso-pruebas-2' and d['storage_diagnostic']['readwrite_status']=='pass' and d['storage_diagnostic']['cleanup_status']=='pass' and not d['production_activation_approved']
            checks.append({'name':'Published diagnostic runs six native storage stages and exports separate results without login','pass':True})
            page.goto(base+'pruebas/ensayo/v3/',wait_until='domcontentloaded');page.get_by_role('heading',name='Ensayo sin configurar').wait_for(timeout=20000);assert page.locator('#login-form').count()==0
            checks.append({'name':'Unconfigured test entry refuses production fallback','pass':True})
            timepage=context.new_page();timepage.clock.set_fixed_time(datetime.datetime(2026,9,25,18,4,25,tzinfo=datetime.timezone.utc));timepage.goto(base+'live-demo/');timepage.locator('.city-card').first.wait_for()
            assert timepage.locator('#server-clock').inner_text()=='15:04:25'
            checks.append({'name':'Published Paraguay clock uses UTC-3 at the fixed test instant','pass':True});browser.close()
          pathlib.Path('evidence/published-smoke.json').write_text(json.dumps({'scope':'Public routes, browser-local synthetic demos and disposable browser storage only; no production login or database writes; not physical phones','source_commit':live['source_commit'],'accepted_source':accepted,'passed':len(checks),'failed':0,'checks':checks},indent=2));print(json.dumps(checks,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-v3-published-smoke
          path: evidence/
          retention-days: 14
