name: Deploy Pulso frontend
on:
  push:
    branches: [main]
    paths-ignore: ['*.zip','.github/workflows/import-package.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Import Pulso package']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      ACCEPTED: 74a46e6ba3698646f7f50ab254c2a60ef39353a2
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PULSO_ENVIRONMENT: workspace-3.1.3-visual-r2
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Require exact native runtime and final illustrated-media acceptance
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36412078632 > /tmp/runtime.json
          gh api repos/${{ github.repository }}/actions/runs/36418459043 > /tmp/media.json
          python - <<'PY'
          import json,os
          for path,sha in [('/tmp/runtime.json',os.environ['ACCEPTED']),('/tmp/media.json','fbb9f2a657ec9e59fca4f3f9d9486105960d5fc8')]:
            r=json.load(open(path));assert r['head_sha']==sha and r['status']=='completed' and r['conclusion']=='success'
          PY
          git fetch --no-tags --depth=1 origin "$ACCEPTED"
          git diff --exit-code "$ACCEPTED" HEAD -- supabase v3/web v3/live v3/scripts scripts ':!v3/web/manual-es.html'
      - name: Complete source and identity regression checks
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          node --test tests/*.cjs
          python tests/import_package_test.py
          node scripts/prepare-web.mjs
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs
          python docs/build-company-manuals.py
          python -m py_compile docs/training314/*.py
          node --check docs/tutorials/site/tutorials.js
      - name: Build unchanged field data paths with signed-in-name presentation
        run: |
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
          rm -rf web/v3 web/v3-demo web/tutoriales
          mkdir -p web/v3 web/v3-demo /tmp/pulso-illustrated-release
          cp -a v3/dist/. web/v3/
          cp -a v3/preview/. web/v3-demo/
          node v3/live/build.mjs
          node scripts/prepare-pruebas.mjs
      - name: Install approved durable release and illustrated manuals at existing links
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python docs/training314/publish_install.py --destination web/tutoriales
      - name: Verify publication boundaries and record exact hashes
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,hashlib,re
          for folder in ['v3','v3-demo','pruebas/ensayo/v3']:
            p=pathlib.Path('web')/folder;assert not (p/'manual-es-zh.html').exists()
            text=(p/'manual-es.html').read_text();assert text.count('<section id="s')==26 and text.count('<article class="step"')==147
            assert not re.search('[\u3400-\u9fff]|Super Admin|jaimehuang168@gmail',text)
          assert not pathlib.Path('web/pruebas/guia-zh.html').exists()
          for name in ['web/pruebas/index.html','web/pruebas/ensayo/index.html']:
            assert not re.search('[\u3400-\u9fff]',pathlib.Path(name).read_text())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          paths=['v3/app.js','v3/workspace.css','v3/manual-es.html','tutoriales/index.html','tutoriales/files.json']
          files={f:hashlib.sha256((pathlib.Path('web')/f).read_bytes()).hexdigest() for f in paths}
          report={'version':'3.1.3','edition':'visual-r2','source_commit':commit,'accepted_runtime':'74a46e6ba3698646f7f50ab254c2a60ef39353a2','native_acceptance_run':36412078632,'media_acceptance_run':36418459043,'signed_in_identity_visible':True,'database_changed':False,'new_sql_required':False,'physical_device_certification':False,'private_manual_published':False,'public_language':'es','files':files}
          pathlib.Path('web/company-release.json').write_text(json.dumps(report,indent=2));pathlib.Path('/tmp/pulso-illustrated-release/company-release.json').write_text(json.dumps(report,indent=2))
          PY
          git archive --format=zip HEAD -o /tmp/pulso-illustrated-release/source.zip
          tar -C web/v3 -czf /tmp/pulso-illustrated-release/app-frontend.tar.gz .
          tar -C web/v3-demo -czf /tmp/pulso-illustrated-release/app-demo.tar.gz .
          echo 'Session name/code, 147 illustrated steps and matched Spanish narration published. No SQL, production votes, cloud resources or private manual changes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        with: {name: pulso-illustrated-app-release, path: /tmp/pulso-illustrated-release/, retention-days: 14}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with: {path: web}
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
  smoke:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify public identity, all media hashes, images and actual video playback
        run: python docs/training314/verify_published.py
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with: {name: pulso-identity-illustrated-published, path: evidence/, retention-days: 14}
