name: V3 source snapshot
on:
  push:
    branches: ['v3/field-operations']
    paths: ['.github/workflows/v3-source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Export only version-controlled source
        run: |
          mkdir -p /tmp/pulso-source
          git archive --format=zip HEAD -o /tmp/pulso-source/source.zip
          git rev-parse HEAD > /tmp/pulso-source/SOURCE_SHA.txt
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-v3-source-snapshot
          path: /tmp/pulso-source/
          retention-days: 7
