name: V3 baseline and test toolchain
on:
  push:
    branches: ['v3/field-operations']
    paths: ['.github/workflows/v3-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Verify existing source
        run: |
          node --check web/app.js
          node --test tests/*.cjs
          python tests/import_package_test.py
      - name: Prepare isolated build dependencies
        run: |
          mkdir -p /tmp/pulso-v3-tools
          cd /tmp/pulso-v3-tools
          npm init -y
          npm install --save-exact @electric-sql/pglite esbuild fflate qrcode
          npm audit --json > audit.json || true
      - name: Package exact source and toolchain without credentials
        run: |
          mkdir -p /tmp/pulso-v3-artifact
          git archive HEAD > /tmp/pulso-v3-artifact/baseline.tar
          git rev-parse HEAD > /tmp/pulso-v3-artifact/BASELINE_SHA.txt
          tar -C /tmp -czf /tmp/pulso-v3-artifact/toolchain.tar.gz pulso-v3-tools
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-v3-baseline-toolchain
          path: /tmp/pulso-v3-artifact/
          retention-days: 3
