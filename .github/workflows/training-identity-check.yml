name: Identity and illustrated training verification
on:
  push:
    branches: [ux/identity-illustrated-training]
    paths: [.github/workflows/training-identity-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Build isolated current UI
        run: |
          npm --prefix v3 ci
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read-only screens and identity checks
        run: python docs/training314/read_screens.py --demo v3/preview --login v3/dist --out /tmp/illustrated/read
      - name: Existing isolated tutorial capture regression
        run: python docs/tutorials/capture.py --demo v3/preview --login v3/dist --out /tmp/illustrated/flow
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with: {name: pulso-illustrated-current-screens, path: /tmp/illustrated/, retention-days: 14}
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env: {LOCAL_STATUS_FILE: /tmp/pulso-v3-local-status.json, SUPABASE_TELEMETRY_DISABLED: '1'}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Unchanged backend and complete pure regression
        run: |
          git diff --exit-code bfed33ef35a3f24ec9b0affdc09704a117015e0d -- supabase v3/web/modules/api.mjs v3/web/modules/vault.mjs v3/live
          git show bfed33ef35a3f24ec9b0affdc09704a117015e0d:v3/web/modules/workspace.mjs | cmp - v3/web/modules/workspace-base.mjs
          npm --prefix v3 ci
          mkdir -p v3/evidence
          node --test tests/*.cjs > v3/evidence/legacy-unit.txt
          python tests/import_package_test.py
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs > v3/evidence/unit.txt
          node v3/tests/company.mjs
          node v3/tests/direct-use.mjs
          node v3/tests/live-board.mjs
          node v3/tests/live-console-sql.mjs
      - name: Disposable backend tools
        run: |
          mkdir -p /tmp/pulso-v3-cli
          npm --prefix /tmp/pulso-v3-cli install --save-exact supabase@2.117.0
          echo '/tmp/pulso-v3-cli/node_modules/.bin' >> "$GITHUB_PATH"
      - name: Start unlinked local backend
        run: |
          mkdir -p /tmp/pulso-v3-local
          supabase init --workdir /tmp/pulso-v3-local --yes
          node v3/tests/prepare-local.mjs /tmp/pulso-v3-local
          python - <<'PY'
          import pathlib,re,tomllib
          p=pathlib.Path('/tmp/pulso-v3-local/supabase/config.toml');s=p.read_text()
          for section,enabled in [('auth',False),('auth.email',True)]:
            pattern=r'(?ms)(^\['+re.escape(section)+r'\]\s*\n)(.*?)(?=^\[|\Z)'
            def replace(m):
              body,n=re.subn(r'(?m)^enable_signup\s*=.*$', 'enable_signup = '+str(enabled).lower(),m[2]);assert n==1;return m[1]+body
            s,n=re.subn(pattern,replace,s);assert n==1
          cfg=tomllib.loads(s);assert cfg['auth']['enable_signup'] is False and cfg['auth']['email']['enable_signup'] is True;p.write_text(s)
          PY
          supabase start --workdir /tmp/pulso-v3-local --exclude studio,imgproxy,logflare,vector,supavisor,postgres-meta,mailpit > /tmp/start.log 2>&1
          supabase status --workdir /tmp/pulso-v3-local --output json > "$LOCAL_STATUS_FILE"
          node - <<'JS'
          const s=require(process.env.LOCAL_STATUS_FILE);for(const k of ['ANON_KEY','SERVICE_ROLE_KEY','JWT_SECRET','PUBLISHABLE_KEY','SECRET_KEY'])if(s[k])console.log('::add-mask::'+s[k]);
          JS
      - name: Serve local Edge
        run: |
          printf 'PULSO_V3_ORIGINS=http://127.0.0.1:8044\nAPP_ORIGIN=http://127.0.0.1:8044\n' > /tmp/pulso-v3-edge.env
          supabase functions serve field-enrollment --workdir /tmp/pulso-v3-local --env-file /tmp/pulso-v3-edge.env > /tmp/edge.log 2>&1 &
          echo $! > /tmp/pulso-v3-edge.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://127.0.0.1:8044' http://127.0.0.1:54321/functions/v1/field-enrollment || true)
            if [ "$code" = 204 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Existing real authentication and HTTP tests
        timeout-minutes: 15
        run: |
          node v3/tests/native.mjs
          node v3/tests/load-native.mjs
          node v3/tests/restore-native.mjs
          node v3/tests/live-native.mjs
          node v3/tests/company-native.mjs
          node v3/tests/direct-native-check.mjs
      - name: Build native and demo clients
        run: |
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import{spawnSync}from'node:child_process';const s=JSON.parse(fs.readFileSync(process.env.LOCAL_STATUS_FILE));const r=spawnSync(process.execPath,['v3/scripts/build.mjs'],{stdio:'inherit',env:{...process.env,SUPABASE_URL:s.API_URL,SUPABASE_PUBLISHABLE_KEY:s.ANON_KEY,PULSO_ENVIRONMENT:'identity-native-ci'}});process.exit(r.status??1);
          JS
          mkdir -p web/v3
          cp -a v3/dist/. web/v3/
          node v3/live/build.mjs
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Complete browser regression
        timeout-minutes: 15
        run: |
          python v3/tests/company-browser.py
          python v3/tests/live-native-browser.py
          python v3/direct/browser.py
          python v3/tests/workspace-browser.py
      - name: Strict evidence verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          root=pathlib.Path('v3/evidence');root.mkdir(parents=True,exist_ok=True);checks=[]
          for name,minimum in [('company.json',32),('direct-use-sql.json',18),('native.json',16),('load-native.json',5),('restore-native.json',3),('live-native.json',17),('company-native.json',16),('direct-native.json',6),('company-browser/results.json',22),('live-native-browser.json',66),('direct-native-browser.json',20),('workspace-browser/results.json',54)]:
            p=root/name
            if not p.exists():checks.append({'file':name,'pass':False,'reason':'Missing evidence'});continue
            d=json.loads(p.read_text());checks.append({'file':name,'pass':d.get('failed')==0 and d.get('passed',0)>=minimum,'passed':d.get('passed',0),'failed':d.get('failed',0)})
          result={'scope':'Unlinked disposable Supabase and Chromium/WebKit, not production or physical devices','pass':all(x['pass'] for x in checks),'checks':checks};(root/'identity-verdict.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2));sys.exit(0 if result['pass'] else 1)
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with: {name: pulso-identity-native-evidence, path: v3/evidence/, retention-days: 14}
      - name: Cleanup disposable backend
        if: always()
        run: |
          if [ -f /tmp/pulso-v3-edge.pid ]; then kill "$(cat /tmp/pulso-v3-edge.pid)" || true; fi
          if command -v supabase >/dev/null; then supabase stop --workdir /tmp/pulso-v3-local --no-backup || true; fi
          rm -f /tmp/pulso-company-private.json /tmp/pulso-live-private.json /tmp/pulso-v3-browser-private.json /tmp/pulso-v3-local-context.json /tmp/pulso-v3-local-status.json /tmp/pulso-v3-edge.env
