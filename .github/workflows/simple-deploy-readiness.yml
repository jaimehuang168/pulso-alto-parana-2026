name: Personal phone deployment readiness
on:
  push:
    branches: [feat/simple-personal-login]
    paths: [.github/workflows/simple-deploy-readiness.yml]
permissions: {contents: read}
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check presence only, no secret values leave the runner
        env:
          MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_URL: ${{ vars.SUPABASE_URL }}
        run: |
          mkdir -p /tmp/readiness
          python - <<'PY'
          import json,os,pathlib
          d={'management_credential_available':bool(os.environ.get('MANAGEMENT_TOKEN')),'existing_project_url_configured':bool(os.environ.get('PROJECT_URL')),'database_changed':False,'edge_deployed':False,'credentials_exported':False}
          pathlib.Path('/tmp/readiness/backend-deployment-readiness.json').write_text(json.dumps(d,indent=2));print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        with: {name: pulso-backend-deployment-readiness, path: /tmp/readiness/, retention-days: 7}
