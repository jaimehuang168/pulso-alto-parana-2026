name: V3 release candidate review
on:
  push:
    branches: ['v3/field-operations']
    paths: ['.github/workflows/v3-review-r3.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: v3-source-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: v3/field-operations
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Prepare reviewed source and test corrections
        run: |
          python v3/scripts/review-r3.py
          python v3/tests/prepare-realtime-check.py
          python v3/scripts/prepare-metrics.py
          python v3/scripts/review-r5.py
          node v3/scripts/make-upgrade.mjs
      - name: Locked dependencies and regression tests
        run: |
          npm --prefix v3 ci
          node --test tests/*.cjs
          python tests/import_package_test.py
          node v3/scripts/check.mjs
          node --test v3/tests/*.test.mjs
          node v3/tests/database.mjs
          node v3/tests/enrollment.mjs
          node v3/tests/review.mjs
          cd v3 && npm audit --json > evidence/dependency-audit.json
      - name: Commit verified source and start native integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- supabase/migrations/005_v3_api.sql supabase/migrations/007_v3_cutover.sql supabase/migrations/008_v3_storage.sql supabase/V3_UPGRADE_EXISTING.sql v3/tests/native.mjs v3/tests/database.mjs v3/tests/browser.py v3/web/modules/views.mjs v3/web/styles.css v3/web/app.mjs
          if ! git diff --cached --quiet; then
            git commit -m '修正手機非同步畫面競態與紙本重試識別碼，保留詳細原生驗證'
            git push origin HEAD:v3/field-operations
          fi
          gh workflow run v3-native.yml --ref v3/field-operations
      - name: Build isolated demonstration and unconfigured private frontend
        run: |
          node v3/scripts/fetch-vendor.mjs
          node v3/scripts/build.mjs --demo
          node v3/scripts/build.mjs
      - name: Install real browser engines
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Actual browser forms and encrypted storage
        run: python v3/tests/browser.py
      - name: Package reviewed source and evidence without secrets
        if: always()
        run: |
          mkdir -p /tmp/pulso-review
          git rev-parse HEAD > /tmp/pulso-review/SOURCE_SHA.txt
          git archive --format=zip HEAD -o /tmp/pulso-review/source.zip
          cp -r v3/evidence /tmp/pulso-review/evidence
          if [ -d v3/preview ]; then tar -C v3/preview -czf /tmp/pulso-review/isolated-demo.tar.gz .; fi
          if [ -d v3/dist ]; then tar -C v3/dist -czf /tmp/pulso-review/private-frontend.tar.gz .; fi
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: pulso-v3-review-release
          path: /tmp/pulso-review/
          retention-days: 14
