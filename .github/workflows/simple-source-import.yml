name: Prepare personal phone source
on:
  push:
    branches: [feat/simple-personal-login]
    paths: [.github/workflows/simple-source-import.yml]
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: feat/simple-personal-login}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Expand only hash-verified source
        run: |
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import base64,hashlib,tarfile,io
          parts=[Path('v3/simple/source-'+str(i)+'.txt') for i in [1,2]]
          b=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(b).hexdigest()=='7f7f493b81ba53b7322971aa35626bba00f703ff12c5a0ac141f8fa50c971bc3'
          with tarfile.open(fileobj=io.BytesIO(b),mode='r:xz') as t:
            assert len(t.getmembers())==10
            for m in t.getmembers():
              p=PurePosixPath(m.name);assert m.isfile() and not p.is_absolute() and '..' not in p.parts and m.size<100000
              assert m.name.startswith(('v3/simple/','v3/tests/simple','v3/web/modules/device-vault','v3/web/modules/simple-login','supabase/migrations/015_','supabase/functions/interviewer-access/'))
              dest=Path(m.name);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(t.extractfile(m).read())
          for p in parts:p.unlink()
          PY
          python v3/simple/patch.py
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          for name,sha in json.loads(Path('v3/simple/source-files.json').read_text()).items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          PY
          npm --prefix v3 ci
          node --check v3/web/app.mjs
          node v3/scripts/check.mjs
          node --test v3/tests/simple-login.test.mjs
      - name: Commit explicit source paths only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v3/simple v3/tests/simple-login.test.mjs v3/tests/simple-sql.mjs v3/tests/simple-native.mjs v3/tests/simple-browser.py v3/web/modules/device-vault.mjs v3/web/modules/simple-login.mjs v3/web/app.mjs v3/web/modules/api.mjs v3/web/modules/core.mjs v3/web/modules/views.mjs v3/web/modules/workspace-base.mjs supabase/config.toml supabase/migrations/015_v3_simple_interviewers.sql supabase/functions/interviewer-access/index.ts
          if ! git diff --cached --quiet; then git commit -m '加入Admin建訪員帳密、個人手機自動保護與受限自動任務；保留舊待傳';git push origin HEAD:feat/simple-personal-login;fi
