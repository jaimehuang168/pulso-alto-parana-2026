name: Verify 60 interviewer scopes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scope-recheck.yml']
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-isolated-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Source unit tests
        run: |
          node --check web/app.js
          node --check web/core.js
          node --test tests/*.cjs
          python tests/import_package_test.py
      - name: Install isolated database client
        run: python -m pip install psycopg2-binary==2.9.10 PyYAML==6.0.2
      - name: Recheck all 60 scopes on disposable PostgreSQL
        run: |
          mkdir -p audit-results
          python - <<'PY'
          import yaml, subprocess
          from pathlib import Path
          source=yaml.safe_load(Path('.github/workflows/readiness-audit.yml').read_text())
          steps=source['jobs']['audit']['steps']
          shell=next(x['run'] for x in steps if x.get('name')=='Database role and concurrency audit')
          shell=shell.replace("name='TEST '+id::text", "name='TEST '||id::text")
          marker='call(admin,"select public.set_fieldwork_state(\'open\')")'
          assert shell.count(marker)==1, 'Source changed; review before running'
          extra=r'''
          # All writes below are to the disposable localhost PostgreSQL container.
          # No production password, user token, database URL or service key is used.
          for index,agent in enumerate(agents):
            code=['CDE','MGA','HER','PFR'][index//15]+'-'+str(index%15+1).zfill(2)
            meta=call(agent['uid'],'select public.bootstrap()')[0][0]
            district=agent['district']
            expected={'cde':2,'minga':4,'hernandarias':2,'franco':4}[district]
            check(code+' server metadata scope',lambda meta=meta,district=district,expected=expected,agent=agent:
              len(meta['districts'])==1 and meta['districts'][0]['id']==district
              and len(meta['candidates'])==expected
              and all(c['district_id']==district for c in meta['candidates'])
              and all(s['district_id']==district for s in meta['stations'])
              and any(str(s['id'])==agent['station'] for s in meta['stations']))
            foreign=next(x for x in agents if x['district']!=district)
            check(code+' rejects foreign-city candidate',lambda agent=agent,foreign=foreign:
              deny(agent['uid'],submit,(Json(event(agent,outcome='candidate',consent=True,candidate_id=foreign['candidate'])),),code='23514'))
            other_local=next(x for x in agents if x['district']==district and x['station']!=agent['station'])
            check(code+' rejects other assigned local in same city',lambda agent=agent,other_local=other_local:
              deny(agent['uid'],submit,(Json(event(agent,station_id=other_local['station'])),),code='23514'))
            check(code+' cannot read another interviewer profile',lambda agent=agent,other_local=other_local:
              call(agent['uid'],'select count(*) from public.profiles where id=%s',(other_local['uid'],))[0][0]==0)
          '''
          shell=shell.replace(marker, marker+'\n'+extra)
          Path('/tmp/pulso-scope.sh').write_text(shell)
          subprocess.run(['bash','/tmp/pulso-scope.sh'],check=True)
          PY
      - name: Current live non-login checks only
        if: always()
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          source=yaml.safe_load(Path('.github/workflows/readiness-audit.yml').read_text())
          shell=next(x['run'] for x in source['jobs']['audit']['steps'] if x.get('name')=='Live read-only unauthenticated probes')
          subprocess.run(['bash','-c',shell],check=True)
          PY
      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: pulso-60-scope-evidence
          path: audit-results/
          retention-days: 14
      - name: Explicit result, not a production certification
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          failures=[]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('## 60訪員隔離驗收\n僅隔離 PostgreSQL 可寫入；正式站只做未登入檢查。沒有正式庫正向寫入證據。\n')
            for name in ['database','live']:
              path=Path('audit-results')/(name+'.json')
              if not path.exists():failures.append(name+': no evidence');continue
              obj=json.loads(path.read_text());bad=[x['name'] for x in obj['tests'] if not x['pass']]
              summary.write(f"{name}: {len(obj['tests'])-len(bad)}/{len(obj['tests'])}\n")
              print(name,len(obj['tests']),bad);failures.extend(bad)
            summary.write('尚須已登入正式端到端、真實Android/iPhone、Realtime、備份復原驗收。\n')
          if failures:raise SystemExit(1)
          PY
