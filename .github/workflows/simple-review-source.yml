name: Apply reviewed personal phone source
on:
  push:
    branches: [feat/simple-personal-login]
    paths: [.github/workflows/simple-review-source.yml]
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: feat/simple-personal-login}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Apply source and validate without any hosted project
        run: |
          python docs/simple/review_fixes.py
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/simple-login.test.mjs
          node v3/tests/simple-sql.mjs
          python -m py_compile v3/tests/simple-browser.py
      - name: Commit only reviewed runtime and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- supabase/migrations/015_v3_simple_interviewers.sql v3/web/modules/workspace-base.mjs v3/web/modules/views.mjs v3/tests/simple-sql.mjs v3/tests/simple-browser.py
          git commit -m '修正Admin恢復訪員工作權，維持無偽造簡訓；補足WebKit真斷線恢復驗收'
          git push origin HEAD:feat/simple-personal-login
