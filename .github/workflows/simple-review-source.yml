name: Apply reviewed personal phone source
on:
  push:
    branches: [feat/simple-personal-login]
    paths: [.github/workflows/simple-review-source.yml]
permissions: {contents: write}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: feat/simple-personal-login}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22', package-manager-cache: false}
      - name: Apply source and validate without any hosted project
        run: |
          python docs/simple/review_fixes.py
          python - <<'PY'
          from pathlib import Path
          p=Path('v3/tests/simple-sql.mjs');s=p.read_text()
          old="await check('No false activation or synthetic vote inserted',async()=>{assert.deepEqual((await db.query('select * from pulso_v3.operations')).rows,before);"
          new="await check('No false activation or synthetic vote inserted',async()=>{const after=(await db.query('select * from pulso_v3.operations')).rows;const clean=rows=>rows.map(({revision,updated_at,...rest})=>rest);assert.deepEqual(clean(after),clean(before));assert.equal(Number(after[0].revision),Number(before[0].revision)+2);assert(Date.parse(after[0].updated_at)>=Date.parse(before[0].updated_at));"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          npm --prefix v3 ci
          node v3/scripts/check.mjs
          node --test v3/tests/simple-login.test.mjs
          node v3/tests/simple-sql.mjs
          python -m py_compile v3/tests/simple-browser.py
      - name: Commit only reviewed runtime and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- supabase/migrations/015_v3_simple_interviewers.sql v3/web/modules/workspace-base.mjs v3/web/modules/views.mjs v3/tests/simple-sql.mjs v3/tests/simple-browser.py
          git commit -m '修正Admin恢復訪員工作權，維持無偽造簡訓；補足WebKit真斷線恢復驗收'
          git push origin HEAD:feat/simple-personal-login
