name: Publish approved illustrated training
on:
  push:
    branches: [ux/identity-illustrated-training]
    paths: [.github/workflows/illustrated-release.yml]
  workflow_dispatch:
permissions: {contents: write, actions: read}
concurrency: {group: illustrated-release-r2, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Require both real runtime and final media acceptance
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/36412078632 > /tmp/runtime.json
          gh api repos/${{ github.repository }}/actions/runs/36418459043 > /tmp/media.json
          python - <<'PY'
          import json
          for p,sha in [('/tmp/runtime.json','74a46e6ba3698646f7f50ab254c2a60ef39353a2'),('/tmp/media.json','fbb9f2a657ec9e59fca4f3f9d9486105960d5fc8')]:
            d=json.load(open(p));assert d['head_sha']==sha and d['status']=='completed' and d['conclusion']=='success'
          PY
          git diff --exit-code 74a46e6ba3698646f7f50ab254c2a60ef39353a2 HEAD -- supabase v3/web v3/live v3/scripts scripts ':!v3/web/manual-es.html'
          mkdir -p /tmp/released
          gh api repos/${{ github.repository }}/actions/artifacts/10968896390/zip > /tmp/artifact.zip
          python - <<'PY'
          import zipfile,pathlib,hashlib
          p=pathlib.Path('/tmp/artifact.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='e4e17e4914735b5a6c04979dd5cb8783545e775c4bdcf805735d2756936a23c5'
          with zipfile.ZipFile(p) as z:
            assert set(z.namelist())=={'PACKAGE_SHA256.txt','Pulso_Guia_Visual_R2_ES.zip'}
            z.extractall('/tmp/released')
          PY
          python docs/training314/publish_install.py --archive /tmp/released/Pulso_Guia_Visual_R2_ES.zip --validate-only
      - name: Test full installation and fail-closed rejection
        run: |
          python - <<'PY'
          import importlib.util,pathlib,tempfile,json
          spec=importlib.util.spec_from_file_location('m','docs/training314/publish_install.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          src=pathlib.Path('/tmp/released')/m.ARCHIVE;checks=[]
          with tempfile.TemporaryDirectory() as folder:
            p=pathlib.Path(folder);dest=p/'web/tutoriales';m.install(src,dest);assert len(list((dest/'images').glob('*.jpg')))==147;checks.append('Complete verified installation')
            try:m.install(src,dest)
            except AssertionError:checks.append('Occupied destination rejected')
            else:raise RuntimeError('Unexpected overwrite')
            bad=p/'corrupt.zip';bad.write_bytes(src.read_bytes()[:-1])
            try:m.validate(bad)
            except AssertionError:checks.append('Corrupted package rejected')
            else:raise RuntimeError('Unexpected package acceptance')
          pathlib.Path('/tmp/released/installer-checks.json').write_text(json.dumps({'pass':True,'checks':checks},indent=2))
          PY
      - name: Publish the exact existing archive and read it back
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          tag=pulso-guia-visual-3.1.3-r2
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" /tmp/released/Pulso_Guia_Visual_R2_ES.zip --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title 'Pulso · Guía visual paso a paso R2' --notes '26 capítulos y 147 pasos con capturas actuales. Manual Admin, manual de usuarios y manual completo. Dos videos con nueva voz sintética en español de Paraguay, Tania, ritmo +3% y tono +4 Hz. Datos ficticios de formación; no es grabación continua ni certificación de producción. SHA-256: 9dc5384a3a2d880876e147d65b95eb7ef580ff32e21a5956df11777802774c6d.'
          fi
          mkdir -p /tmp/readback
          gh release download "$tag" --repo "${{ github.repository }}" --pattern Pulso_Guia_Visual_R2_ES.zip --dir /tmp/readback
          cmp /tmp/released/Pulso_Guia_Visual_R2_ES.zip /tmp/readback/Pulso_Guia_Visual_R2_ES.zip
          git archive --format=zip HEAD -o /tmp/released/source.zip
          git rev-parse HEAD > /tmp/released/SOURCE_SHA.txt
          echo 'Verified durable public release; no production database changes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.0
        with: {name: pulso-illustrated-release-proof, path: /tmp/released/, retention-days: 14}
