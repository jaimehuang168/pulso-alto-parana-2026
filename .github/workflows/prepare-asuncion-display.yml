name: Prepare reviewed Asuncion display fix
on:
  push:
    branches: ['fix/asuncion-display']
    paths: ['.github/workflows/prepare-asuncion-display.yml']
permissions:
  contents: write
  actions: write
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fix/asuncion-display
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare only exact reviewed timestamp formatting expressions
        shell: python
        run: |
          from pathlib import Path
          targets=[('v3/web/modules/core.mjs',"import {formatAsuncion} from './asuncion-time.mjs';\n", "new Intl.DateTimeFormat('es-PY',{timeZone:'America/Asuncion',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)", "formatAsuncion(d,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})"),('v3/live/core.mjs',"import {formatAsuncion} from '../web/modules/asuncion-time.mjs';\n", "new Intl.DateTimeFormat('es-PY',{timeZone:'America/Asuncion',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(iso))", "formatAsuncion(iso,{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'})"),('v3/web/modules/report-render.mjs',"import {formatAsuncion} from './asuncion-time.mjs';\n", "new Intl.DateTimeFormat('es-PY',{timeZone:'America/Asuncion',...(justTime?{}:{year:'numeric',month:'2-digit',day:'2-digit'}),hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(t))", "formatAsuncion(t,{...(justTime?{}:{year:'numeric',month:'2-digit',day:'2-digit'}),hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})")]
          for file,imp,old,new in targets:
            p=Path(file);text=p.read_text();assert text.count(old)==1,'Unexpected source; no forced patch: '+file
            p.write_text(imp+text.replace(old,new))
      - name: Check deterministic formatter without network or database
        run: |
          npm --prefix v3 ci
          node --test v3/tests/*.test.mjs
          node v3/scripts/check.mjs
      - name: Commit only formatter call sites then verify that exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v3/web/modules/core.mjs v3/web/modules/report-render.mjs v3/live/core.mjs
          git commit -m '統一 2026 巴拉圭 UTC-3 顯示；保留原 UTC 資料與所有計算'
          git push origin HEAD:fix/asuncion-display
          gh workflow run storage-statistics-review.yml --ref fix/asuncion-display
          gh workflow run live-native-integration.yml --ref fix/asuncion-display
