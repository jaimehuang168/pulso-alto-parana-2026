name: Final Spanish documentation
on:
  push:
    branches: ['ui/v2-style-spanish-workspace']
    paths: ['.github/workflows/workspace-docs.yml']
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ui/v2-style-spanish-workspace
      - name: Match current buttons and remove retired public-language routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/workspace-manual.py');s=p.read_text();s=s.replace('seleccione Autorizar alcance para un coordinador','seleccione Asignar alcance para un coordinador');s=s.replace('La documentación bilingüe y la administración técnica se entregan por un canal separado al responsable. El sitio de trabajo y este manual público permanecen completamente en español.','Solicite asistencia a la persona responsable cuando una función no esté disponible. No intente resolver un permiso mediante otra cuenta o una dirección alternativa.');p.write_text(s)
          for name in ['web/pruebas/index.html','web/pruebas/ensayo/index.html']:
            p=Path(name);s=p.read_text();url='../../v3/manual-es.html' if 'ensayo/' in name else '../v3/manual-es.html'
            s=re.sub(r'<a\b[^>]*href="(?:\.\./)?guia-zh\.html"[^>]*>[\s\S]*?</a>','<a href="'+url+'">Manual de uso en español</a>',s)
            s=s.replace('Guarde la evidencia del respaldo ya comprobado. Active únicamente la copia para realizar el ensayo, con una referencia que indique «preparación de ensayo aislado, no aceptación de producción». No declare aprobadas pruebas todavía no ejecutadas.','Utilice la copia de ensayo que ya esté preparada. No hay un formulario de activación de versión. Registre solo las pruebas realmente realizadas, sin introducir datos ficticios en producción.')
            assert not re.search('[\u3400-\u9fff]',s);p.write_text(s)
          Path('web/pruebas/guia-zh.html').unlink(missing_ok=True)
          PY
          python docs/build-company-manuals.py
      - name: Commit documentation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/workspace-manual.py v3/web/manual-es.html web/pruebas/index.html web/pruebas/ensayo/index.html web/pruebas/guia-zh.html
          if ! git diff --cached --quiet; then git commit -m '手冊名稱與實際按鈕一致；公開測試頁維持全西文';git push origin HEAD:ui/v2-style-spanish-workspace;fi
