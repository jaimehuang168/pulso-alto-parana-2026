name: Final illustrated training acceptance
on:
  push:
    branches: [ux/identity-illustrated-training]
    paths: [.github/workflows/illustrated-final.yml]
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - name: Read accepted synthetic screenshots
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p /tmp/screens /tmp/manual
          gh api repos/${{ github.repository }}/actions/artifacts/10965725175/zip > /tmp/ui.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10967076503/zip > /tmp/native.zip
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import zipfile,hashlib,shutil
          for src,sha,dest in [('/tmp/ui.zip','4f01ecc6442b9392f98c5599c8e936349aa06d4ffd8980fb8393520cb3575e28','/tmp/screens'),('/tmp/native.zip','07b4f19b5a753e9586fc0d13b7cf3212cb288218a2569d2a2201cfa0f130332b','/tmp/native')]:
            assert hashlib.sha256(Path(src).read_bytes()).hexdigest()==sha
            with zipfile.ZipFile(src) as z:
              for f in z.infolist():
                p=PurePosixPath(f.filename);assert not p.is_absolute() and '..' not in p.parts
              z.extractall(dest)
          out=Path('/tmp/screens/native');out.mkdir()
          mapping={'login':'teaching-login.png','login_form':'teaching-login-form.png','alias':'teaching-alias.png','policy':'teaching-policy.png','channel':'teaching-channel.png','viewer':'teaching-viewer.png','cut':'teaching-cut.png','cut-actions':'teaching-cut-actions.png','task-pending':'webkit-teaching-task-pending.png','task-confirmed':'webkit-teaching-task-confirmed.png','live':'chromium-native-four-cities.png','viewer-live':'chromium-native-four-cities.png'}
          for name,source in mapping.items():shutil.copyfile(Path('/tmp/native/live-native-browser')/source,out/(name+'.png'))
          PY
      - name: Build pixel-correct manual before narration
        run: |
          python -m pip install pillow==11.3.0 reportlab==4.4.3 pymupdf==1.26.4
          python docs/training314/final_guide.py --source docs/training314 --screens /tmp/screens --out /tmp/manual
          python - <<'PY'
          from pathlib import Path
          import fitz,json,re
          out=Path('/tmp/manual');d=json.loads((out/'course-es.json').read_text());checks=[]
          for name,audience in [('Manual_Admin_ES','admin'),('Manual_Usuarios_ES','usuarios'),('Manual_Completo_ES',None)]:
            pdf=fitz.open(out/(name+'.pdf'));text=' '.join(p.get_text() for p in pdf);compact=re.sub(r'\s+',' ',text)
            for c in d['chapters']:
              if audience and c['audience']!=audience:continue
              for s in c['steps']:
                assert s['id']+' ·' in compact,(name,s['id'])
                assert re.sub(r'\s+',' ',s['text']) in compact,(name,s['id'],'text')
            assert all(p.get_images() or len(p.get_text().strip())>30 for p in pdf)
            checks.append({'file':name+'.pdf','pages':len(pdf),'all_steps_present':True})
          assert len(list((out/'images').glob('*.jpg')))==147
          for p in [out/'manual.html',out/'course-es.json']:assert not re.search('[\u3400-\u9fff]|jaimehuang168@gmail.com|Super Admin',p.read_text())
          (out/'document-checks.json').write_text(json.dumps({'pass':True,'chapters':26,'illustrated_steps':147,'checks':checks},indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        with: {name: pulso-final-manual-r2, path: /tmp/manual/, retention-days: 30}
  video:
    needs: manual
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy: {fail-fast: false, matrix: {audience: [admin, usuarios]}}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8.0.1
        with: {name: pulso-final-manual-r2, path: /tmp/manual}
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install pillow==11.3.0 edge-tts==7.2.8
      - name: Render full step-by-step narration and captions
        run: python docs/training314/render_media.py --folder /tmp/manual --out /tmp/video --audience ${{ matrix.audience }}
      - name: Verify audible non-silent narration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,re
          p=Path('/tmp/video');v=json.loads(next(p.glob('*-video.json')).read_text());assert v['voice']=='es-PY-TaniaNeural'
          r=subprocess.run(['ffmpeg','-hide_banner','-i',str(p/v['file']),'-af','volumedetect','-vn','-f','null','-'],capture_output=True,text=True,check=True)
          mean=float(re.search(r'mean_volume: ([\-\d.]+) dB',r.stderr)[1]);peak=float(re.search(r'max_volume: ([\-\d.]+) dB',r.stderr)[1]);assert -35<mean<-8 and -5<peak<=0
          (p/(v['id']+'-audio-check.json')).write_text(json.dumps({'pass':True,'voice':v['voice'],'mean_db':mean,'peak_db':peak},indent=2))
          PY
      - uses: actions/upload-artifact@v7.0.0
        with: {name: 'pulso-final-video-${{ matrix.audience }}-r2', path: /tmp/video/, retention-days: 30}
  acceptance:
    needs: [manual, video]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8.0.1
        with: {pattern: 'pulso-final-*-r2', path: /tmp/public, merge-multiple: true}
      - name: Assemble existing player with new matched media
        run: |
          cp docs/tutorials/site/style.css docs/tutorials/site/tutorials.js /tmp/public/
          cp docs/training314/index.html /tmp/public/index.html
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os,re
          p=Path('/tmp/public');course=json.loads((p/'course-es.json').read_text());videos=[json.loads((p/(a+'-video.json')).read_text()) for a in ['admin','usuarios']]
          assert sum(len(v['steps']) for v in videos)==147 and sum(len(v['chapters']) for v in videos)==26
          for v in videos:
            assert v['voice']=='es-PY-TaniaNeural' and v['checks']['full_decode']
            assert hashlib.sha256((p/v['file']).read_bytes()).hexdigest()==v['sha256']
            script=(p/v['transcript']).read_text()
            for c in course['chapters']:
              if c['audience']==v['id']:
                for s in c['steps']:assert s['text'] in script
          (p/'tutorials.json').write_text(json.dumps({'version':'3.1.3','edition':'visual-r2','language':'es','build_commit':os.environ['GITHUB_SHA'],'render_run':int(os.environ['GITHUB_RUN_ID']),'manual_steps':147,'videos':videos},ensure_ascii=False,indent=2))
          (p/'CREDITOS.txt').write_text('PULSO - GUIA VISUAL R2\nCapturas actuales con datos ficticios de formacion.\nNarracion sintetica nueva en espanol de Paraguay: Tania, ritmo +3%, tono +4 Hz.\n147 pasos del manual narrados; no es una grabacion continua ni certificacion de produccion.\nNo contiene credenciales, datos reales de votantes ni el manual bilingue privado.\n')
          for f in p.rglob('*'):
            if f.is_file() and f.suffix in ['.html','.js','.css','.json','.txt','.srt','.vtt']:
              assert not re.search('[\u3400-\u9fff]|Super Admin|jaimehuang168@gmail.com',f.read_text()),f
          PY
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual playback, seeking, subtitles and responsive player
        run: python docs/tutorials/verify_player.py /tmp/public
      - name: Every illustrated step and complete image loads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,threading,http.server,functools
          from playwright.sync_api import sync_playwright
          p=Path('/tmp/public');course=json.loads((p/'course-es.json').read_text());server=http.server.ThreadingHTTPServer(('127.0.0.1',8074),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(p)));threading.Thread(target=server.serve_forever,daemon=True).start();checks=[]
          with sync_playwright() as w:
            browser=w.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1050});page.goto('http://127.0.0.1:8074/manual.html')
            assert page.locator('section[id^=s]').count()==26 and page.locator('article.step').count()==147
            for c in course['chapters']:
              for s in c['steps']:assert s['text'] in page.locator('[id="paso-'+s['id']+'"]').inner_text()
            page.locator('img').evaluate_all('(imgs)=>imgs.forEach(i=>i.loading="eager")');page.wait_for_function('[...document.images].every(i=>i.complete&&i.naturalWidth>0)',timeout=60000)
            checks.append({'name':'147 matching steps and images loaded','pass':True})
            for width in [320,390,768,1440]:
              page.set_viewport_size({'width':width,'height':900});assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1');checks.append({'name':str(width)+'px manual no overflow','pass':True})
            page.locator('[id="paso-03.2"]').scroll_into_view_if_needed();page.screenshot(path=str(p/'manual-desktop.png'));page.set_viewport_size({'width':390,'height':844});page.locator('[id="paso-22.3"]').scroll_into_view_if_needed();page.screenshot(path=str(p/'manual-mobile.png'));browser.close()
          server.shutdown();(p/'illustrated-checks.json').write_text(json.dumps({'pass':True,'checks':checks},indent=2))
          PY
      - name: Produce versioned public package with complete hashes
        run: |
          mkdir -p /tmp/delivery
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          p=Path('/tmp/public');d=json.loads((p/'player-checks.json').read_text());assert d['failed']==0 and d['passed']>=25
          files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()}
          (p/'files.json').write_text(json.dumps({'schema':'pulso-illustrated-files-1','files':files},indent=2))
          dest=Path('/tmp/delivery/Pulso_Guia_Visual_R2_ES.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED) as z:
            for f in sorted(p.rglob('*')):
              if f.is_file():z.write(f,str(f.relative_to(p)))
          (dest.parent/'PACKAGE_SHA256.txt').write_text(hashlib.sha256(dest.read_bytes()).hexdigest()+'  '+dest.name+'\n')
          print('Accepted public media package:',dest.stat().st_size)
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: success()
        with: {name: pulso-illustrated-delivery-r2, path: /tmp/delivery/, retention-days: 30}
